<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — CPSERC</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:
    radial-gradient(900px 460px at 50% -10%, rgba(200,41,31,.30), transparent 60%), var(--navy); padding:20px; }
  .login-card{ width:100%; max-width:380px; background:var(--white); border-radius:12px; padding:34px 30px; box-shadow:0 25px 60px rgba(0,0,0,.4); }
  .login-card .eyebrow{ font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; color:var(--red); text-transform:uppercase; margin-bottom:8px; }
  .login-card h2{ color:var(--navy); font-size:22px; margin-bottom:6px; }
  .login-card .sub{ font-size:13.5px; color:var(--steel); margin-bottom:22px; }
  .login-card .badge-center{ display:flex; justify-content:center; margin-bottom:16px; }
  .login-card .badge-center .badge-mini{ width:44px; height:44px; }

  /* FIX: Wrapper ug Eye Icon button style */
  .password-container {
    position: relative !important;
    width: 100%;
    display: flex;
    align-items: center;
  }
  
  .password-container input {
    width: 100%;
    padding-right: 42px !important; /* Spacing para dili ma-overlapping ang text ug icon */
    box-sizing: border-box;
  }

  .eye-btn {
    position: absolute;
    right: 10px;
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--steel, #64748b);
    z-index: 10;
  }

  .eye-btn:hover {
    color: var(--navy, #0f172a);
  }

  .eye-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="badge-center"><span class="badge-mini"></span></div>
    <div class="eyebrow" style="text-align:center;">CPSERC</div>
    <h2 style="text-align:center;">Log In</h2>
    <p class="sub" style="text-align:center;">
      Members and officers both log in here — you'll be taken straight to your dashboard.
    </p>
    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="CPSERC.rizal" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-container">
          <input type="password" id="loginPass" autocomplete="current-password" required>
          <button type="button" class="eye-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <!-- Open Eye Icon -->
            <svg id="eyeOpen" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Closed Eye Icon (Hidden by default) -->
            <svg id="eyeClosed" viewBox="0 0 24 24" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
      <p style="margin-top:14px; font-size:12px; text-align:center;">
        <a href="index.html" style="color:var(--steel);">&larr; Back home</a>
      </p>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/common.js"></script>
<script>
  // Show / Hide Password Script
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const passInput = document.getElementById('loginPass');
  const eyeOpen = document.getElementById('eyeOpen');
  const eyeClosed = document.getElementById('eyeClosed');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passInput.type === 'password';
    passInput.type = isPassword ? 'text' : 'password';
    
    // Switch icons
    eyeOpen.style.display = isPassword ? 'none' : 'block';
    eyeClosed.style.display = isPassword ? 'block' : 'none';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Logging in…';

    try{
      // 1. Officer / admin credentials (defined in js/firebase-config.js)
      if(username === ADMIN_USERNAME && password === ADMIN_PASSWORD){
        sessionStorage.setItem('cpserc_admin', '1');
        location.href = 'admin.html';
        return;
      }

      // 2. Member credentials (stored in Firestore by the admin)
      const snap = await db.collection('users')
        .where('username', '==', username)
        .where('password', '==', password)
        .limit(1).get();

      if(!snap.empty){
        const doc = snap.docs[0];
        sessionStorage.setItem('cpserc_user', JSON.stringify({ id: doc.id, ...doc.data() }));
        location.href = 'user.html';
        return;
      }

      showToast('Incorrect username or password.', 'err');
    } catch(err){
      console.error(err);
      showToast('Log-in failed: ' + err.message, 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
