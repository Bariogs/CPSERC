<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — CPSERC</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:
    radial-gradient(900px 460px at 80% -10%, rgba(200,41,31,.30), transparent 60%), var(--navy); padding:20px; }
  .login-card{ width:100%; max-width:380px; background:var(--white); border-radius:12px; padding:34px 30px; box-shadow:0 25px 60px rgba(0,0,0,.4); }
  .login-card .eyebrow{ font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; color:var(--red); text-transform:uppercase; margin-bottom:8px; }
  .login-card h2{ color:var(--navy); font-size:22px; margin-bottom:22px; }

  .dash-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px; }
  .dash-head h1{ font-size:22px; color:var(--navy); margin:0; }
  .dash-head .sub{ font-family:var(--f-mono); font-size:12px; color:var(--steel); }

  .grid-2{ display:grid; grid-template-columns:1.1fr .9fr; gap:22px; align-items:start; }
  .panel{ padding:22px; }
  .panel h3{ font-size:15px; color:var(--navy); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .schedule-status{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:8px; background:var(--fog); margin-bottom:18px; }
  .schedule-status .lbl{ font-family:var(--f-mono); font-size:11px; color:var(--steel); letter-spacing:.06em; text-transform:uppercase; }
  .schedule-status .val{ font-family:var(--f-display); font-size:15px; color:var(--navy); }

  .action-row{ display:flex; gap:12px; flex-wrap:wrap; margin:22px 0; }

  .att-list{ display:grid; gap:10px; }
  .att-row{
    display:grid; grid-template-columns:50px 1fr auto auto; gap:14px; align-items:center;
    background:var(--white); border:1px solid var(--steel-200); border-radius:8px; padding:10px 14px;
    cursor:pointer; transition:border-color .12s;
  }
  .att-row:hover{ border-color:var(--navy); }
  .att-thumb{ width:50px; height:50px; border-radius:6px; object-fit:cover; background:var(--fog); }
  .att-name{ font-weight:600; font-size:14px; color:var(--ink); }
  .att-meta{ font-size:12px; color:var(--steel); font-family:var(--f-mono); }
  .att-qr{ width:44px; height:44px; }

  .member-list{ display:grid; gap:8px; }
  .member-row{
    display:flex; justify-content:space-between; align-items:center; background:var(--fog);
    border-radius:8px; padding:10px 14px; font-size:13.5px; cursor:pointer;
    border:1px solid transparent; transition:border-color .12s, background .12s;
  }
  .member-row:hover{ border-color:var(--navy); background:#fff; }
  .member-row .u{ font-family:var(--f-mono); font-size:12px; color:var(--steel); }

  .search-row{ display:flex; gap:8px; margin-bottom:16px; }
  .search-row input{ flex:1; }

  .detail-photo{ width:100%; border-radius:8px; margin-bottom:16px; background:var(--fog); aspect-ratio:1/1; object-fit:cover; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:18px; }
  .detail-grid .k{ font-family:var(--f-mono); font-size:11px; letter-spacing:.05em; color:var(--steel); text-transform:uppercase; }
  .detail-grid .v{ font-size:14px; font-weight:600; color:var(--ink); }
  .detail-grid .v.full{ grid-column:1/-1; }

  .cred-box{ background:var(--navy); color:#fff; border-radius:8px; padding:16px; font-family:var(--f-mono); font-size:14px; margin-top:16px; }
  .cred-box .row{ display:flex; justify-content:space-between; margin-bottom:6px; }
  .cred-box b{ color:var(--amber); }

  @media (max-width:820px){
    .grid-2, .form-row{ grid-template-columns:1fr; }
    .att-row{ grid-template-columns:44px 1fr; }
    .att-row .att-qr, .att-row .att-status{ grid-column:2; justify-self:start; }
  }
</style>
</head>
<body>

<!-- ============================= LOGIN ============================= -->
<div id="loginShell" class="login-shell">
  <div class="login-card">
    <div class="eyebrow">Officer Access</div>
    <h2>CPSERC Admin Log-in</h2>
    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUser" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
      <p style="margin-top:14px; font-size:12px; text-align:center;">
        <a href="index.html" style="color:var(--steel);">&larr; Back to CPSERC home</a>
      </p>
    </form>
  </div>
</div>

<!-- ============================ DASHBOARD ============================ -->
<div id="dashShell" style="display:none;">
  <header class="topbar">
    <div class="container">
      <div class="brand"><span class="badge-mini"></span> CPSERC Admin</div>
      <div style="display:flex; gap:10px;">
        <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Log Out</button>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <div class="container">
      <div class="dash-head">
        <div>
          <h1>Dashboard</h1>
          <div class="sub" id="todayLabel"></div>
        </div>
      </div>

      <div class="grid-2">
        <!-- Schedule panel -->
        <div class="card panel">
          <h3>📅 Attendance Schedule</h3>
          <div class="schedule-status" id="scheduleStatusBox">
            <div>
              <div class="lbl">Current status</div>
              <div class="val" id="scheduleStatusVal">Loading…</div>
            </div>
            <span class="pill pill-inactive" id="schedulePill">—</span>
          </div>

          <form id="scheduleForm">
            <div class="field">
              <label>Event Name</label>
              <input type="text" id="eventName" placeholder="e.g. Flag Ceremony Duty" required>
            </div>
            <div class="form-row">
              <div class="field">
                <label>Date</label>
                <input type="date" id="eventDate" required>
              </div>
              <div class="field">
                <label>&nbsp;</label>
                <label style="display:flex; align-items:center; gap:8px; margin-top:6px; text-transform:none; font-family:var(--f-body); font-size:14px;">
                  <input type="checkbox" id="eventActive" style="width:auto;" checked> Open for attendance
                </label>
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label>Time Start</label>
                <input type="time" id="timeStart" required>
              </div>
              <div class="field">
                <label>Time End</label>
                <input type="time" id="timeEnd" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Save Schedule</button>
          </form>
        </div>

        <!-- Members panel -->
        <div class="card panel">
          <h3>👥 Registered Members <span style="margin-left:auto; font-family:var(--f-mono); font-size:12px; color:var(--steel);" id="memberCount"></span></h3>
          <button id="addUserBtn" class="btn btn-navy btn-block" style="margin-bottom:16px;">+ Add User</button>

          <div class="search-row">
            <input type="text" id="memberSearchInput" placeholder="Search by name…">
            <button id="memberSearchBtn" class="btn btn-primary">Search</button>
          </div>

          <div class="member-list scroll-list" id="memberList"></div>
        </div>
      </div>

      <div class="action-row">
        <button id="checkAttendanceBtn" class="btn btn-primary">🔍 Check Attendance</button>
        <button id="downloadBtn" class="btn btn-ghost">⬇ Download All Data (CSV)</button>
      </div>

      <div id="attendanceSection" style="display:none;">
        <div class="card panel">
          <h3>Attendance Log <span style="margin-left:auto; font-family:var(--f-mono); font-size:12px; color:var(--steel);" id="attCount"></span></h3>
          <div class="att-list scroll-list" id="attList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ========================= ADD USER MODAL ========================= -->
<div class="modal-backdrop" id="addUserModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add Member</h3>
      <button class="modal-close" data-close="addUserModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="addUserForm">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="newFullName" placeholder="Juan Miguel Dela Cruz" required>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Course</label>
            <select id="newCourse" required>
              <option value="">Select</option>
              <option>BSIT</option>
              <option>HM</option>
              <option>Social Work</option>
              <option>CTE</option>
              <option>BSBA</option>
            </select>
          </div>
          <div class="field">
            <label>Year Level</label>
            <select id="newYearLevel" required>
              <option value="">Select</option>
              <option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Username</label>
            <input type="text" id="newUsername" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="text" id="newPassword" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="addUserSubmitBtn">Create Account</button>
      </form>
      <div id="credResult" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- ===================== EDIT PASSWORD MODAL ===================== -->
<div class="modal-backdrop" id="editPassModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Edit Member Password</h3>
      <button class="modal-close" data-close="editPassModal">&times;</button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:14px; font-size:13.5px;" id="editPassName"></p>
      <form id="editPassForm">
        <div class="field">
          <label>New Password</label>
          <input type="text" id="editPassInput" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="editPassSubmitBtn">Save Password</button>
      </form>
    </div>
  </div>
</div>

<!-- ===================== ATTENDANCE DETAIL MODAL ===================== -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Check-in Detail</h3>
      <button class="modal-close" data-close="detailModal">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
